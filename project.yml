name: FanReader
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PageCurlKit:
    url: https://github.com/Orshanski/PageCurlKit
    from: "1.0.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  FanReader:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: PageCurlKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 翻页
        CFBundleShortVersionString: "0.9.17"
        CFBundleVersion: "43"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        UIBackgroundModes:
          - audio
        UIRequiresFullScreen: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 连接局域网内的自建语音合成服务
        CFBundleDocumentTypes:
          - CFBundleTypeName: Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.content
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fanreader
        PRODUCT_NAME: FanReader
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
